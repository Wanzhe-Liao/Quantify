name: grid-laboratory
on:
  push:
    branches: [research/grid-laboratory]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements*.txt'
      - '.github/workflows/grid-laboratory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grid-laboratory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and record environment
        run: |
          pip install -r requirements-lab.txt
          mkdir -p validation
          pip freeze > validation/requirements.lock.txt
          git rev-parse HEAD > validation/commit.txt
      - name: Regression tests
        run: pytest -q --junitxml=validation/pytest.xml
      - name: Complete bounded strategy search
        run: |
          set -o pipefail
          python -u scripts/run_grid_lab.py | tee validation/grid_lab.log
          cat outputs/grid_lab/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-laboratory-results
          path: |
            outputs/grid_lab/
            validation/
            src/grid_lab.py
            scripts/run_grid_lab.py
            tests/test_grid_lab*.py
            docs/grid_laboratory.md
            requirements-lab.txt
          if-no-files-found: error
          retention-days: 30
